schema = "https://github.com/ASSERT-KTH/assert-research-agent/blob/main/schemas/audit-v1.json"

[paper]
pdf = "paper/main.pdf"

[results]
files = ["paper/results/numbers.json"]
instruments = ["paper/numbers.py", "preregistration/rq1/estimate.py"]

